<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <meta name="description" content="8×8 の盤に、下に出る 3 つのブロックを好きな順に置き、縦か横の列をうめて消していく。今日の盤は全員に同じ順番でブロックが配られるので、同じ条件でスコアを比べられる。">
  <title>ROWBREAK — 置いて消す 8×8 ブロック</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ROWBREAK">
  <meta property="og:title" content="ROWBREAK — 置いて消す 8×8 ブロック">
  <meta property="og:description" content="8×8 の盤に、下に出る 3 つのブロックを好きな順に置き、縦か横の列をうめて消していく。今日の盤は全員に同じ順番でブロックが配られるので、同じ条件でスコアを比べられる。">
  <meta property="og:url" content="https://t-of.github.io/rowbreak/">
  <meta property="og:image" content="https://t-of.github.io/rowbreak/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ROWBREAK">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="bar">
      <div class="modes" role="group">
        <button class="seg" data-mode="daily" data-t="mode.daily">今日の盤</button>
        <button class="seg" data-mode="endless" data-t="mode.endless">エンドレス</button>
      </div>
      <div class="bar__actions">
        <button class="pill" id="lang">English</button>
        <button class="pill" id="sound" aria-pressed="true">音 オン</button>
      </div>
    </header>

    <section class="score" aria-live="polite">
      <div class="score__n" id="score">0</div>
      <div class="score__sub" id="sub"></div>
    </section>

    <section class="stage" id="stage">
      <div class="board" id="board"></div>
      <div class="fx" id="fx"></div>
      <div class="coach" id="coach" hidden>
        <ol>
          <li data-t="coach.1">下のブロックを指で盤へ運んで置く。回せない</li>
          <li data-t="coach.2">縦か横の 1 列がうまると消える。何列もまとめて消すほど高い点</li>
          <li data-t="coach.3">どれも置けなくなったら終わり</li>
        </ol>
        <button class="btn btn--main" id="coachOk" data-t="coach.ok">はじめる</button>
      </div>
    </section>

    <section class="hand" id="hand">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
    </section>

    <footer class="foot">
      <a href="/" data-t="credit">T.OF... のアプリ</a>
      <span class="foot__actions">
        <button class="pill" data-wak="install" data-t="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share" data-t="share">共有</button>
      </span>
    </footer>
  </main>

  <div class="float" id="float" hidden></div>

  <!-- 結果（下から出るカード）。隠すときは display: none -->
  <div class="sheet" id="result" hidden>
    <div class="card">
      <p class="card__title" id="rTitle"></p>
      <p class="card__label" id="rLabel"></p>
      <p class="card__score" id="rScore"></p>
      <p class="card__lines"><span id="rLines"></span> <span class="card__best" id="rBest" hidden></span></p>
      <p class="card__note" id="rNote" hidden></p>
      <div class="card__actions">
        <!-- 動画を見て引き直す場所（仕様 11）。最初の版では出さない -->
        <button class="btn" id="redraw" data-t="retry" hidden>引き直し（1 回だけ）</button>
        <button class="btn btn--main" id="again"></button>
        <button class="pill" id="rShare" data-t="share">共有</button>
      </div>
    </div>
  </div>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
